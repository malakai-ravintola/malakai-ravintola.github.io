<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Lahjakortti – tulostus | Malakai Ravintola</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:12mm}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#e9e9e9;font-family:Inter,system-ui,sans-serif;color:#111}
.bar{position:sticky;top:0;background:#000;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:2}
.bar b{font-weight:600}.bar button{background:#E3A51C;border:0;color:#000;font:700 15px Inter;padding:11px 20px;border-radius:999px;cursor:pointer}
.bar label{display:flex;gap:8px;align-items:center;font-size:14px}
.sheet{width:186mm;margin:12px auto;display:flex;flex-direction:column;gap:6mm;background:#fff;padding:0}
.card{position:relative;height:84mm;border-radius:5mm;overflow:hidden;color:#fff;display:grid;grid-template-columns:1fr 70mm;
background:radial-gradient(circle at 30% 10%,rgba(227,165,28,.33),transparent 50%),linear-gradient(135deg,#1a1a1a,#050505);border:.6mm solid #C9921A;outline:.3mm dashed #999;outline-offset:2.5mm}
.l{padding:8mm 9mm;display:flex;flex-direction:column;justify-content:space-between}
.brand b{display:block;font:500 13mm/1 "Playfair Display",Georgia,serif}
.brand small{display:block;font:500 2.6mm Inter;letter-spacing:1.6mm;color:#bbb;margin-top:1.5mm;padding-left:1mm}
.tag{font:700 3mm Inter;letter-spacing:1.8mm;color:#E3A51C}
.big{font:500 8mm/1.15 "Playfair Display",Georgia,serif;margin-top:1mm}
.foot{font-size:2.8mm;color:#aaa;line-height:1.5}
.r{background:#fff;color:#111;margin:5mm 5mm 5mm 0;border-radius:3mm;padding:6mm 6mm;display:flex;flex-direction:column;justify-content:space-between}
.f{display:flex;flex-direction:column;gap:1mm}.f span{font:700 2.4mm Inter;letter-spacing:.6mm;text-transform:uppercase;color:#555}
.f i{display:block;border-bottom:.3mm solid #222;height:7mm;font-style:normal;font:500 4mm Inter;padding-top:1.5mm}
.f.sum i{height:10mm;font:500 6.5mm "Playfair Display",Georgia,serif}
.valid{font:600 2.8mm Inter;color:#111;background:#F6E7C4;border-radius:1.5mm;padding:1.8mm 2.5mm;text-align:center}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0}}
@media screen and (max-width:760px){.sheet{zoom:.5}}
</style></head><body>
<div class="bar"><b>Malakai – lahjakorttipohja (A4, 3 korttia / sivu)</b><label><input type="checkbox" id="cut" checked> Leikkuuviivat</label><button onclick="print()">Tulosta</button></div>
<div class="sheet" id="sheet"></div>
<template id="t"><div class="card">
<div class="l"><div class="brand"><b>Malakai</b><small>RAVINTOLA</small></div>
<div><div class="tag">LAHJAKORTTI</div><div class="big">Hyvää ruokaa<br>lahjaksi</div></div>
<div class="foot">Tampereentie 414, 33880 Lempäälä · 045 353 7000<br>malakairavintola.fi</div></div>
<div class="r"><div class="f sum"><span>Arvo</span><i></i></div><div class="f"><span>Kortin nro</span><i></i></div><div class="f"><span>Ostopäivä</span><i></i></div><div class="f"><span>Myyjä</span><i></i></div><div class="valid">Voimassa 6 kk ostopäivästä</div></div>
</div></template>
<script>
const sh=document.getElementById('sheet'),t=document.getElementById('t');for(let i=0;i<3;i++)sh.appendChild(t.content.cloneNode(true));
document.getElementById('cut').onchange=e=>document.querySelectorAll('.card').forEach(c=>c.style.outlineStyle=e.target.checked?'dashed':'none');
</script>
</body></html>
