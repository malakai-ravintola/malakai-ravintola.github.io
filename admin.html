<header><div class="w"><h1 class="lg"><a href="index.html" target="_blank" rel="noopener"><b>Malakai</b><small>RAVINTOLA</small></a><span>Ylläpito</span></h1><a href="index.html" target="_blank" rel="noopener">Avaa sivusto ↗</a>
<nav class="tabs" id="tabs"></nav></div></header>
<main class="w" id="main"></main>
<div class="save" id="saveBar"><div class="w"><span id="saveTxt">Ei tallentamattomia muutoksia</span><button class="o" id="undo" disabled>Peru muutokset</button><button id="saveBtn" disabled>Tallenna ja julkaise</button></div></div>
<div id="toast" hidden></div>
<script src="data.js?v=1793961114"></script>
<script src="config.js?v=1793961114"></script>
<script>
(function(){
const REPO="malakai-ravintola/malakai-ravintola.github.io",BR="main",FILE="data.js";
const $=s=>document.querySelector(s);
const mk=(t,a,...k)=>{const e=document.createElement(t);if(a)for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x==="text")e.textContent=v;else if(x.startsWith("on"))e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v===true?"":v)}k.flat().forEach(c=>c!=null&&e.append(c));return e};
const clone=o=>JSON.parse(JSON.stringify(o));
const fe=n=>n?String(n).replace(".",","):"";
const pn=s=>{s=String(s||"").replace(",",".").replace(/[^\d.]/g,"");return s?Math.round(parseFloat(s)*100)/100:0};
let toastT;function toast(t,bad){const e=$("#toast");e.textContent=t;e.className=bad?"bad":"";e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,bad?6000:3000)}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

// ---------- Tila
let S=clone(window.SITE||{}),ORIG=JSON.stringify(S),SHA=null,TOKEN=ls.get("gh_token")||"";
const DAYS=[["ma","Maanantai"],["ti","Tiistai"],["ke","Keskiviikko"],["to","Torstai"],["pe","Perjantai"],["la","Lauantai"],["su","Sunnuntai"]];
const dirty=()=>JSON.stringify(S)!==ORIG;
function mark(){const d=dirty();$("#saveBar").classList.toggle("dirty",d);$("#saveTxt").textContent=d?"Tallentamattomia muutoksia":(SHA?"Kaikki muutokset tallennettu":"Ei tallentamattomia muutoksia");$("#saveBtn").disabled=!d;$("#undo").disabled=!d}
addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue=""}});

// ---------- GitHub
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opt={}){const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+path+(opt.method?"":"?ref="+BR+"&t="+Date.now()),{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"}});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(r.status===401?"GitHub-avain ei kelpaa tai on vanhentunut":r.status===403||r.status===404?"Avaimella ei ole oikeutta tähän repoon (tarvitaan Contents: Read and write)":r.status===409?"Joku muu tallensi välissä. Lataa sivu uudelleen.":j.message||"GitHub-virhe "+r.status);e.status=r.status;throw e}return j}
const parse=txt=>{const m=txt.match(/\/\*BEGIN\*\/([\s\S]*)\/\*END\*\//);if(!m)throw new Error("data.js on väärässä muodossa");return JSON.parse(m[1])};
const build=o=>"// Sivuston muokattava sisältö. Muokkaa admin.html-sivulla.\nwindow.SITE=/*BEGIN*/"+JSON.stringify(o,null,1)+"/*END*/;\nwindow.MENU=window.SITE.menu;\n";
async function pull(){const j=await gh(FILE);SHA=j.sha;S=parse(b64d(j.content));ORIG=JSON.stringify(S);mark();render()}
async function push(){if(!TOKEN){tab="Asetukset";render();return toast("Lisää ensin GitHub-avain",true)}
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="Tallennetaan…";
  try{if(!SHA){const j=await gh(FILE);SHA=j.sha}
    const r=await gh(FILE,{method:"PUT",body:JSON.stringify({message:"Ylläpito: sisältö päivitetty",content:b64e(build(S)),sha:SHA,branch:BR})});
    SHA=r.content.sha;ORIG=JSON.stringify(S);mark();toast("Tallennettu! Muutokset näkyvät sivulla muutaman minuutin kuluttua.")}
  catch(e){toast(e.message,true)}finally{btn.textContent="Tallenna ja julkaise";mark()}}
async function upload(file){if(!TOKEN)throw new Error("Lisää ensin GitHub-avain Asetukset-välilehdellä");
  if(file.size>4e6)throw new Error("Kuva on liian suuri (yli 4 Mt). Pienennä se ensin.");
  const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(file)});
  const name=file.name.toLowerCase().replace(/\.[^.]+$/,"").normalize("NFD").replace(/[^\w-]+/g,"-").replace(/-+/g,"-").slice(0,40)||"kuva",ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path="media/ladatut/"+Date.now().toString(36)+"-"+name+"."+ext;
  await gh(path,{method:"PUT",body:JSON.stringify({message:"Ylläpito: kuva ladattu",content:data,branch:BR})});return path}
function imgPicker(cur,set){const prev=mk("img",{class:"prev",src:cur,alt:""}),inp=mk("input",{type:"file",accept:"image/*"});
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;toast("Ladataan kuvaa…");try{const p=await upload(f);prev.src=URL.createObjectURL(f);set(p);toast("Kuva ladattu. Muista tallentaa.")}catch(e){toast(e.message,true)}inp.value=""};
  return mk("div",null,mk("label",null,"Vaihda kuva",inp),prev)}

// ---------- Näkymät
let tab="Yleiskatsaus",cat=null;
