<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Malakai ylläpito</title>

<style>

@media(min-width:1100px){.dr{transform:none;width:280px;box-shadow:none!important}.dr .dh button{display:none}body.auth{padding-left:280px}.top .mn{display:none}.save{left:280px!important}}
/* Lomakkeet ja napit */
input,select,textarea{width:100%;background:#fff;color:#111;border:1.5px solid var(--line);padding:10px 12px;font:inherit;font-size:16px;border-radius:12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);outline-offset:0;border-color:var(--y)}

.dtab{width:100%;border-collapse:collapse;font-size:.9rem}.dtab th{text-align:left;color:var(--g);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}.dtab td{padding:10px 6px;border-bottom:1px solid var(--line)}.dtab tr.peruttu td{color:#999;text-decoration:line-through}.dtab tr.uusi td{background:#FFF7E3}.dtab tr.tot td{font-weight:800}
@media print{body{background:#fff!important;color:#000!important;padding:0!important}.noprint,.dr,.top,.hero,nav,.cats,.toast{display:none!important}.card{border:0!important;background:#fff!important;box-shadow:none!important}.dtab td,.dtab th{color:#000;border-color:#ccc}}

.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--g)}

button.tile:hover{background:#fff;box-shadow:0 0 0 2px var(--y)}.tile b{font:800 2rem Inter,sans-serif;color:#111}.tile span{font-weight:500;font-size:.88rem;color:var(--g)}

.row.res{align-items:center}.rmain{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:240px}
.rwhen{min-width:62px;white-space:nowrap}.rwhen b{font:800 1.35rem Inter,sans-serif;display:block;line-height:1.1}.rwhen small{color:var(--g)}
.row small a{color:var(--g)}.row .note{color:var(--w);font-style:italic}.rbtn{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

.row.res.peruttu{opacity:.55}.dhead{font:700 .78rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#9A6A00;padding:16px 0 2px}
.pill.nl{background:#DCE8FB;color:#1E4FA8}.row>.pill{align-self:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:14px;overflow:auto}
.mbox{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:620px;max-height:calc(100vh - 28px);overflow:auto}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
details.cust{border-bottom:1px solid var(--line)}details.cust summary{display:flex;justify-content:space-between;gap:10px;padding:12px 0;cursor:pointer;list-style:none;flex-wrap:wrap}

.cin{padding:0 0 14px}.btnl{display:inline-block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;color:#111;text-decoration:none;font-weight:700;font-size:.85rem;margin:2px;background:#fff}

.ovst{font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--g)}.ovst.ok{color:var(--ok);border-color:var(--ok)}

.ovgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:760px){.ovgrid{grid-template-columns:1fr 1fr}}
input.ovbad{border-color:var(--bad)!important;color:var(--bad);background:#FCE3E5}
.ovrow{display:grid;gap:8px;width:100%;text-align:left;background:#fff;color:var(--w);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:10px 0 0;font:inherit;cursor:pointer}.ovrow:hover{border-color:var(--y);background:#fff}

.ovchips{display:flex;flex-wrap:wrap;gap:6px}.ovchip{font-size:.82rem;font-weight:600;padding:5px 9px;border-radius:8px;background:var(--k3);border:1px solid var(--line)}
.ovchip.ok{color:var(--ok);border-color:transparent;background:#DDF3E6}.ovchip.bad{color:var(--bad);border-color:transparent;background:#FCE3E5}

body:not(.auth) .top,body:not(.auth) .hero,body:not(.auth) .dr,body:not(.auth) main,body:not(.auth) .save{display:none!important}
#gate{max-width:440px;margin:12vh auto;padding:0 16px}#gate form{display:grid;gap:6px}#gate form button{margin-top:6px}
</style></head><body>

<div class="du"><span class="av">MR</span><div><b>Malakai Ravintola</b><br><small>Ylläpito</small></div><button id="lo">Kirjaudu ulos</button></div></aside>

<div class="save" id="saveBar"><div class="w"><span id="saveTxt">Ei tallentamattomia muutoksia</span><button class="o" id="undo" disabled>Peru muutokset</button><button id="saveBtn" disabled>Tallenna ja julkaise</button></div></div>

<script>
(function(){
const REPO="malakai-ravintola/malakai-ravintola.github.io",BR="main",FILE="data.js";
const $=s=>document.querySelector(s);
const mk=(t,a,...k)=>{const e=document.createElement(t);if(a)for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x==="text")e.textContent=v;else if(x.startsWith("on"))e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v===true?"":v)}k.flat().forEach(c=>c!=null&&e.append(c));return e};
const clone=o=>JSON.parse(JSON.stringify(o));

const pn=s=>{s=String(s||"").replace(",",".").replace(/[^\d.]/g,"");return s?Math.round(parseFloat(s)*100)/100:0};
let toastT;function toast(t,bad){const e=$("#toast");e.textContent=t;e.className=bad?"bad":"";e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,bad?6000:3000)}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

// ---------- Tila
let S=clone(window.SITE||{}),ORIG=JSON.stringify(S),SHA=null,TOKEN=ls.get("gh_token")||"";
const DAYS=[["ma","Maanantai"],["ti","Tiistai"],["ke","Keskiviikko"],["to","Torstai"],["pe","Perjantai"],["la","Lauantai"],["su","Sunnuntai"]];
const dirty=()=>JSON.stringify(S)!==ORIG;
function mark(){const d=dirty();$("#saveBar").classList.toggle("dirty",d);$("#saveTxt").textContent=d?"Tallentamattomia muutoksia":(SHA?"Kaikki muutokset tallennettu":"Ei tallentamattomia muutoksia");$("#saveBtn").disabled=!d;$("#undo").disabled=!d}
addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue=""}});

// ---------- GitHub
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(r)};
