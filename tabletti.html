html,body{margin:0;height:100%;background:var(--bg);color:#fff;font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

.ho{display:flex;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}.ho small{color:var(--mut)}
.login{max-width:420px;margin:12vh auto;padding:28px;background:var(--card);border-radius:22px}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:14px 20px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center}.toast.bad{background:#FFDAD4;color:#6B0D04}
.sheet{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6);display:grid;place-items:end center}
.sheet>div{background:var(--card);width:min(560px,100%);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:1.4rem}.sheet p{color:var(--mut);margin:0 0 16px}
.sheet textarea{width:100%;min-height:90px;border-radius:12px;background:#18181A;color:#fff;border:1px solid #3A3A3F;padding:12px;font:inherit;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chips button{background:#34343A;padding:10px 14px;border-radius:999px;font-weight:600}
